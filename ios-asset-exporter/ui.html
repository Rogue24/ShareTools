<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      color: var(--figma-color-text);
      background: var(--figma-color-bg);
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      line-height: 20px;
    }

    p {
      margin: 0;
      color: var(--figma-color-text-secondary);
      line-height: 18px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 550;
    }

    input {
      width: 100%;
      height: 32px;
      padding: 0 9px;
      color: var(--figma-color-text);
      background: var(--figma-color-bg);
      border: 1px solid var(--figma-color-border);
      border-radius: 6px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--figma-color-border-selected);
      box-shadow: 0 0 0 1px var(--figma-color-border-selected);
    }

    button {
      width: 100%;
      height: 36px;
      border: 0;
      border-radius: 6px;
      color: var(--figma-color-text-onbrand);
      background: var(--figma-color-bg-brand);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .panel {
      padding: 10px;
      border: 1px solid var(--figma-color-border);
      border-radius: 8px;
      background: var(--figma-color-bg-secondary);
      line-height: 18px;
      word-break: break-word;
    }

    .status {
      min-height: 18px;
      color: var(--figma-color-text-secondary);
    }

    .error {
      color: var(--figma-color-text-danger);
    }

    .success {
      color: var(--figma-color-text-success);
    }
  </style>
</head>
<body>
  <div class="stack">
    <div>
      <h1>iOS @2x/@3x Export</h1>
      <p>选中图标后，一键导出 PNG 并打成 ZIP。</p>
    </div>

    <div id="selection" class="panel">未选中图层</div>

    <button id="export" disabled>导出 ZIP</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const exportButton = document.getElementById("export");
    const selectionBox = document.getElementById("selection");
    const statusBox = document.getElementById("status");

    const crcTable = (() => {
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n += 1) {
        let c = n;
        for (let k = 0; k < 8; k += 1) {
          c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        }
        table[n] = c >>> 0;
      }
      return table;
    })();

    function setStatus(message, kind) {
      statusBox.textContent = message || "";
      statusBox.className = `status ${kind || ""}`.trim();
    }

    function toUint8Array(value) {
      if (value instanceof Uint8Array) {
        return value;
      }
      if (value instanceof ArrayBuffer) {
        return new Uint8Array(value);
      }
      if (Array.isArray(value)) {
        return new Uint8Array(value);
      }
      return new Uint8Array(value.buffer || value);
    }

    function crc32(bytes) {
      let crc = 0xffffffff;
      for (let index = 0; index < bytes.length; index += 1) {
        crc = crcTable[(crc ^ bytes[index]) & 0xff] ^ (crc >>> 8);
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    function dosDateTime(date) {
      const year = Math.max(1980, date.getFullYear());
      const dosTime = (date.getHours() << 11) |
        (date.getMinutes() << 5) |
        Math.floor(date.getSeconds() / 2);
      const dosDate = ((year - 1980) << 9) |
        ((date.getMonth() + 1) << 5) |
        date.getDate();
      return { dosTime, dosDate };
    }

    function writeUint16(view, offset, value) {
      view.setUint16(offset, value, true);
    }

    function writeUint32(view, offset, value) {
      view.setUint32(offset, value, true);
    }

    function createLocalHeader(nameBytes, dataLength, checksum, now) {
      const header = new Uint8Array(30 + nameBytes.length);
      const view = new DataView(header.buffer);

      writeUint32(view, 0, 0x04034b50);
      writeUint16(view, 4, 20);
      writeUint16(view, 6, 0x0800);
      writeUint16(view, 8, 0);
      writeUint16(view, 10, now.dosTime);
      writeUint16(view, 12, now.dosDate);
      writeUint32(view, 14, checksum);
      writeUint32(view, 18, dataLength);
      writeUint32(view, 22, dataLength);
      writeUint16(view, 26, nameBytes.length);
      writeUint16(view, 28, 0);
      header.set(nameBytes, 30);

      return header;
    }

    function createCentralHeader(nameBytes, dataLength, checksum, offset, now) {
      const header = new Uint8Array(46 + nameBytes.length);
      const view = new DataView(header.buffer);

      writeUint32(view, 0, 0x02014b50);
      writeUint16(view, 4, 20);
      writeUint16(view, 6, 20);
      writeUint16(view, 8, 0x0800);
      writeUint16(view, 10, 0);
      writeUint16(view, 12, now.dosTime);
      writeUint16(view, 14, now.dosDate);
      writeUint32(view, 16, checksum);
      writeUint32(view, 20, dataLength);
      writeUint32(view, 24, dataLength);
      writeUint16(view, 28, nameBytes.length);
      writeUint16(view, 30, 0);
      writeUint16(view, 32, 0);
      writeUint16(view, 34, 0);
      writeUint16(view, 36, 0);
      writeUint32(view, 38, 0);
      writeUint32(view, 42, offset);
      header.set(nameBytes, 46);

      return header;
    }

    function createEndRecord(fileCount, centralLength, centralOffset) {
      const end = new Uint8Array(22);
      const view = new DataView(end.buffer);

      writeUint32(view, 0, 0x06054b50);
      writeUint16(view, 4, 0);
      writeUint16(view, 6, 0);
      writeUint16(view, 8, fileCount);
      writeUint16(view, 10, fileCount);
      writeUint32(view, 12, centralLength);
      writeUint32(view, 16, centralOffset);
      writeUint16(view, 20, 0);

      return end;
    }

    function createZipBlob(files) {
      const encoder = new TextEncoder();
      const chunks = [];
      const centralChunks = [];
      const now = dosDateTime(new Date());
      let offset = 0;
      let centralLength = 0;

      for (let index = 0; index < files.length; index += 1) {
        const file = files[index];
        const nameBytes = encoder.encode(file.name);
        const data = toUint8Array(file.bytes);
        const checksum = crc32(data);
        const localHeader = createLocalHeader(nameBytes, data.length, checksum, now);
        const centralHeader = createCentralHeader(nameBytes, data.length, checksum, offset, now);

        chunks.push(localHeader);
        chunks.push(data);
        centralChunks.push(centralHeader);

        offset += localHeader.length + data.length;
        centralLength += centralHeader.length;
      }

      const centralOffset = offset;
      for (let index = 0; index < centralChunks.length; index += 1) {
        chunks.push(centralChunks[index]);
      }
      chunks.push(createEndRecord(files.length, centralLength, centralOffset));

      return new Blob(chunks, { type: "application/zip" });
    }

    function downloadZip(files) {
      const blob = createZipBlob(files);
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15);

      link.href = url;
      link.download = `ios-assets-${stamp}.zip`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      setStatus("正在导出并打包...", "");
      parent.postMessage({
        pluginMessage: {
          type: "export-ios-assets"
        }
      }, "*");
    });

    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message) {
        return;
      }

      if (message.type === "selection") {
        exportButton.disabled = message.count === 0;
        if (message.count === 0) {
          selectionBox.textContent = "未选中图层";
          setStatus("", "");
          return;
        }

        const names = message.names.join("、");
        selectionBox.textContent = `已选中 ${message.count} 个：${names}`;
      }

      if (message.type === "progress") {
        setStatus(message.message, "");
      }

      if (message.type === "export-result") {
        try {
          setStatus("正在生成 ZIP...", "");
          downloadZip(message.files);
          exportButton.disabled = false;
          setStatus(`已导出 ${message.count} 个图标，共 ${message.files.length} 个 PNG。`, "success");
          if (message.autoClose) {
            parent.postMessage({
              pluginMessage: {
                type: "download-complete"
              }
            }, "*");
          }
        } catch (error) {
          exportButton.disabled = false;
          setStatus(error && error.message ? error.message : String(error), "error");
        }
      }

      if (message.type === "error") {
        exportButton.disabled = false;
        setStatus(message.message, "error");
      }
    };
  </script>
</body>
</html>
